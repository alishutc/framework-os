---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: framework-os
# description will be included in the image's metadata
description: Custom Fedora Atomic COSMIC OS for Framework Laptop 13 (AMD).

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 44 # Pin to Fedora 44 matching host branch

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into image root /

  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - steam
        - steam-devices
        - powertop
        - mangohud

  - type: default-flatpaks
    configurations:
      - scope: user # Enable Flathub user repository for on-demand apps

  - type: signing # sets up proper policy & signing files for cosign verification
