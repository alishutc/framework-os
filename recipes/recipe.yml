---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: framework-os
# description will be included in the image's metadata
description: Custom Fedora Silverblue OS for Framework Laptop 13 (AMD Edition).

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 44

labels:
  containers.bootc.rootfs: btrfs

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into image root /

  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
        - imput/helium
    install:
      packages:
        - steam
        - steam-devices
        - powertop
        - mangohud
        - ffmpegthumbnailer
        - libva-utils
        - jetbrains-mono-fonts-all
        - helium-bin
    remove:
      packages:
        - gnome-software
        - gnome-software-rpm-ostree

  - type: default-flatpaks
    configurations:
      - scope: system # Enable system Flathub remote and install Bazaar system-wide
        install:
          - io.github.kolunmi.Bazaar
      - scope: user # Enable user Flathub remote and install Chrome for the user
        install:
          - com.google.Chrome

  - type: gnome-extensions
    install:
      - Logo Menu
      - AppIndicator and KStatusNotifierItem Support
      - Dash to Dock
      - Blur my Shell
      - Spotlight

  - type: script
    snippets:
      - sed -i "s|// this._addItem(new MenuItem(_('System Settings...')|this._addItem(new MenuItem(_('System Settings...')|" /usr/share/gnome-shell/extensions/logomenu@aryan_k/extension.js

  - type: gschema-overrides
    include:
      - zz-framework.gschema.override

  - type: signing # sets up proper policy & signing files for cosign verification
