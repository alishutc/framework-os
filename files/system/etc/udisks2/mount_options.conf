[defaults]
# Allow execution on user and system mounts (required for Steam libraries and binary execution)
allow=exec,noexec,nodev,nosuid,atime,noatime,nodiratime,relatime,strictatime,lazytime,ro,rw,sync,dirsync,noload,acl,nosymfollow,compress,compress-force,datacow,nodatacow,discard,nodiscard

# Optimized defaults for Btrfs
btrfs_defaults=relatime,compress=zstd:1
btrfs_allow=relatime,noatime,compress,compress-force,datacow,nodatacow,discard,nodiscard,subvol,subvolid

# Ext4 defaults
ext4_defaults=relatime
ext4_allow=relatime,noatime,data,discard,nodiscard,errors

# ExFAT defaults
exfat_defaults=uid=$UID,gid=$GID,iocharset=utf8,errors=remount-ro
exfat_allow=uid=$UID,gid=$GID,umask,dmask,fmask,allow_utime,iocharset,errors,discard

# NTFS3 kernel driver defaults
ntfs:ntfs3_defaults=uid=$UID,gid=$GID,windows_names
ntfs:ntfs3_allow=uid=$UID,gid=$GID,umask,dmask,fmask,iocharset,discard,nodiscard,windows_names
